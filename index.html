<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dash Slash Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ============================================================
// SETUP
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ============================================================
// CONSTANTS
// ============================================================
const DASH_SPEED = 4500;        // px/s — very fast
const DASH_COOLDOWN = 0.20;     // seconds between dashes
const SLASH_WIDTH = 28;         // trail thickness
const SLASH_LIFETIME = 0.18;    // how long the slash hitbox stays active
const SLASH_VISUAL_LIFETIME = 0.35; // how long the slash trail is visible
const HIT_STOP_DURATION = 0.05; // freeze frames on hit
const SCREEN_SHAKE_INTENSITY = 8;
const SCREEN_SHAKE_DURATION = 0.12;
const ENEMY_SPEED = 60;
const ENEMY_RADIUS = 18;
const ARMORED_ENEMY_RADIUS = 24;
const PLAYER_RADIUS = 14;
const SPAWN_INTERVAL = 1.8;     // seconds between spawns
const KNOCKBACK_FORCE = 220;

// ============================================================
// STATE
// ============================================================
let player = {
  x: 0, y: 0,
  dashTarget: null,
  dashStart: null,
  dashDuration: 0,
  dashElapsed: 0,
  isDashing: false,
  cooldownTimer: 0,
};

let enemies = [];
let slashes = [];
let particles = [];
let screenShake = { intensity: 0, duration: 0, elapsed: 0 };
let hitStop = { active: false, duration: 0, elapsed: 0 };
let spawnTimer = 0;
let lastTime = 0;
let score = 0;

// ============================================================
// INIT
// ============================================================
function init() {
  player.x = canvas.width / 2;
  player.y = canvas.height / 2;
  enemies = [];
  slashes = [];
  particles = [];
  score = 0;
  spawnTimer = 0;

  // Spawn initial enemies
  for (let i = 0; i < 5; i++) spawnEnemy();
}

// ============================================================
// INPUT
// ============================================================
canvas.addEventListener('click', (e) => {
  if (player.isDashing || player.cooldownTimer > 0) return;

  const tx = e.clientX;
  const ty = e.clientY;
  const dx = tx - player.x;
  const dy = ty - player.y;
  const dist = Math.sqrt(dx * dx + dy * dy);

  if (dist < 10) return; // too close, ignore

  player.dashStart = { x: player.x, y: player.y };
  player.dashTarget = { x: tx, y: ty };
  player.dashDuration = dist / DASH_SPEED;
  // Clamp min duration so very short dashes still feel like a dash
  player.dashDuration = Math.max(player.dashDuration, 0.04);
  player.dashElapsed = 0;
  player.isDashing = true;
});

// ============================================================
// SPAWN
// ============================================================
function spawnEnemy() {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  const margin = 40;
  switch (side) {
    case 0: x = -margin; y = Math.random() * canvas.height; break;
    case 1: x = canvas.width + margin; y = Math.random() * canvas.height; break;
    case 2: x = Math.random() * canvas.width; y = -margin; break;
    case 3: x = Math.random() * canvas.width; y = canvas.height + margin; break;
  }

  const isArmored = Math.random() < 0.3;

  if (isArmored) {
    // Weak angle: random direction the slash must come from
    const weakAngle = Math.random() * Math.PI * 2;
    enemies.push({
      x, y,
      radius: ARMORED_ENEMY_RADIUS,
      type: 'armored',
      weakAngle,
      hp: 1,
      flashTimer: 0,
      knockback: { vx: 0, vy: 0 },
      deflectFlash: 0,
    });
  } else {
    enemies.push({
      x, y,
      radius: ENEMY_RADIUS,
      type: 'basic',
      hp: 1,
      flashTimer: 0,
      knockback: { vx: 0, vy: 0 },
    });
  }
}

// ============================================================
// COLLISION: point-to-line-segment distance
// ============================================================
function pointToSegmentDist(px, py, ax, ay, bx, by) {
  const abx = bx - ax, aby = by - ay;
  const apx = px - ax, apy = py - ay;
  const ab2 = abx * abx + aby * aby;
  if (ab2 === 0) return Math.sqrt(apx * apx + apy * apy);
  let t = (apx * abx + apy * aby) / ab2;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t * abx;
  const cy = ay + t * aby;
  const dx = px - cx, dy = py - cy;
  return Math.sqrt(dx * dx + dy * dy);
}

// ============================================================
// PARTICLES
// ============================================================
function spawnHitParticles(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 150 + Math.random() * 300;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.25 + Math.random() * 0.2,
      maxLife: 0.35,
      radius: 2 + Math.random() * 3,
      color,
    });
  }
}

function spawnDeflectParticles(x, y) {
  for (let i = 0; i < 6; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 100 + Math.random() * 150;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.15 + Math.random() * 0.1,
      maxLife: 0.25,
      radius: 2 + Math.random() * 2,
      color: '#888',
    });
  }
}

// ============================================================
// UPDATE
// ============================================================
function update(dt) {
  // Hit stop
  if (hitStop.active) {
    hitStop.elapsed += dt;
    if (hitStop.elapsed >= hitStop.duration) {
      hitStop.active = false;
    }
    return; // freeze everything
  }

  // Screen shake
  if (screenShake.duration > 0) {
    screenShake.elapsed += dt;
    if (screenShake.elapsed >= screenShake.duration) {
      screenShake.duration = 0;
    }
  }

  // Player cooldown
  if (player.cooldownTimer > 0) {
    player.cooldownTimer -= dt;
  }

  // Player dash
  if (player.isDashing) {
    player.dashElapsed += dt;
    let t = player.dashElapsed / player.dashDuration;

    // Ease: fast start, slight deceleration at end
    t = Math.min(t, 1);
    const eased = 1 - Math.pow(1 - t, 2); // ease-out quad

    player.x = player.dashStart.x + (player.dashTarget.x - player.dashStart.x) * eased;
    player.y = player.dashStart.y + (player.dashTarget.y - player.dashStart.y) * eased;

    if (t >= 1) {
      player.isDashing = false;
      player.cooldownTimer = DASH_COOLDOWN;

      // Create slash
      slashes.push({
        sx: player.dashStart.x,
        sy: player.dashStart.y,
        ex: player.dashTarget.x,
        ey: player.dashTarget.y,
        width: SLASH_WIDTH,
        hitLifetime: SLASH_LIFETIME,
        visualLifetime: SLASH_VISUAL_LIFETIME,
        hitElapsed: 0,
        visualElapsed: 0,
        hitEnemies: new Set(),
      });
    }
  }

  // Slashes
  for (let i = slashes.length - 1; i >= 0; i--) {
    const s = slashes[i];
    s.hitElapsed += dt;
    s.visualElapsed += dt;

    // Check collisions while hitbox is active
    if (s.hitElapsed <= s.hitLifetime) {
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (s.hitEnemies.has(j)) continue;

        const dist = pointToSegmentDist(e.x, e.y, s.sx, s.sy, s.ex, s.ey);
        if (dist < s.width / 2 + e.radius) {
          s.hitEnemies.add(j);

          if (e.type === 'armored') {
            // Check slash direction vs weak angle
            const slashAngle = Math.atan2(s.ey - s.sy, s.ex - s.sx);
            let angleDiff = slashAngle - e.weakAngle;
            // Normalize to [-PI, PI]
            while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
            while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

            if (Math.abs(angleDiff) < Math.PI / 3) { // ~60 degree tolerance
              // Hit!
              killEnemy(j, s);
            } else {
              // Deflected!
              e.deflectFlash = 0.15;
              spawnDeflectParticles(e.x, e.y);
              // Tiny screen shake for deflect
              screenShake = { intensity: 3, duration: 0.06, elapsed: 0 };
            }
          } else {
            killEnemy(j, s);
          }
        }
      }
    }

    if (s.visualElapsed > s.visualLifetime) {
      slashes.splice(i, 1);
    }
  }

  // Enemies move toward player
  for (const e of enemies) {
    // Apply knockback
    if (e.knockback) {
      e.x += e.knockback.vx * dt;
      e.y += e.knockback.vy * dt;
      e.knockback.vx *= 0.9;
      e.knockback.vy *= 0.9;
    }

    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 1) {
      e.x += (dx / dist) * ENEMY_SPEED * dt;
      e.y += (dy / dist) * ENEMY_SPEED * dt;
    }

    if (e.flashTimer > 0) e.flashTimer -= dt;
    if (e.deflectFlash !== undefined && e.deflectFlash > 0) e.deflectFlash -= dt;
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.95;
    p.vy *= 0.95;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Spawn
  spawnTimer += dt;
  if (spawnTimer >= SPAWN_INTERVAL) {
    spawnTimer = 0;
    spawnEnemy();
    // Gradually increase spawn rate
    if (enemies.length < 3) spawnEnemy();
  }
}

function killEnemy(index, slash) {
  const e = enemies[index];
  score++;

  // Hit stop
  hitStop = { active: true, duration: HIT_STOP_DURATION, elapsed: 0 };

  // Screen shake
  screenShake = { intensity: SCREEN_SHAKE_INTENSITY, duration: SCREEN_SHAKE_DURATION, elapsed: 0 };

  // Knockback direction (along slash)
  const angle = Math.atan2(slash.ey - slash.sy, slash.ex - slash.sx);
  e.knockback = {
    vx: Math.cos(angle) * KNOCKBACK_FORCE,
    vy: Math.sin(angle) * KNOCKBACK_FORCE,
  };

  // Particles
  spawnHitParticles(e.x, e.y, e.type === 'armored' ? '#ffd700' : '#ff4444');

  // Remove enemy
  enemies.splice(index, 1);

  // Fix slash hitEnemies indices (indices shifted after splice)
  for (const s of slashes) {
    const newSet = new Set();
    for (const idx of s.hitEnemies) {
      if (idx < index) newSet.add(idx);
      else if (idx > index) newSet.add(idx - 1);
      // skip the removed index
    }
    s.hitEnemies = newSet;
  }
}

// ============================================================
// DRAW
// ============================================================
function draw() {
  ctx.save();

  // Screen shake offset
  let shakeX = 0, shakeY = 0;
  if (screenShake.duration > 0) {
    const t = 1 - screenShake.elapsed / screenShake.duration;
    const intensity = screenShake.intensity * t;
    shakeX = (Math.random() - 0.5) * 2 * intensity;
    shakeY = (Math.random() - 0.5) * 2 * intensity;
    ctx.translate(shakeX, shakeY);
  }

  // Clear
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(-10, -10, canvas.width + 20, canvas.height + 20);

  // Subtle grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  const gridSize = 60;
  for (let x = 0; x < canvas.width; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }

  // Slash trails
  for (const s of slashes) {
    const alpha = 1 - (s.visualElapsed / s.visualLifetime);
    if (alpha <= 0) continue;

    const angle = Math.atan2(s.ey - s.sy, s.ex - s.sx);
    const perpX = Math.cos(angle + Math.PI / 2);
    const perpY = Math.sin(angle + Math.PI / 2);
    const hw = s.width / 2 * alpha; // shrink as it fades

    // Glowing slash
    ctx.save();
    ctx.globalAlpha = alpha * 0.8;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = hw * 2;
    ctx.lineCap = 'round';
    ctx.shadowColor = '#88ccff';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.moveTo(s.sx, s.sy);
    ctx.lineTo(s.ex, s.ey);
    ctx.stroke();

    // Inner bright line
    ctx.strokeStyle = '#ccefff';
    ctx.lineWidth = hw * 0.6;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(s.sx, s.sy);
    ctx.lineTo(s.ex, s.ey);
    ctx.stroke();
    ctx.restore();
  }

  // Enemies
  for (const e of enemies) {
    ctx.save();

    if (e.type === 'armored') {
      // Deflect flash
      if (e.deflectFlash > 0) {
        ctx.fillStyle = '#666';
      } else {
        ctx.fillStyle = '#886622';
      }

      // Main body
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
      ctx.fill();

      // Armor ring
      ctx.strokeStyle = '#aa8833';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
      ctx.stroke();

      // Weak spot indicator — arc showing where to slash FROM
      const arcHalf = Math.PI / 3;
      ctx.strokeStyle = '#ff4444';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#ff4444';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius + 6, e.weakAngle - arcHalf, e.weakAngle + arcHalf);
      ctx.stroke();

      // Arrow showing slash direction
      const arrowDist = e.radius + 14;
      const ax = e.x + Math.cos(e.weakAngle) * arrowDist;
      const ay = e.y + Math.sin(e.weakAngle) * arrowDist;
      ctx.fillStyle = '#ff4444';
      ctx.beginPath();
      ctx.arc(ax, ay, 3, 0, Math.PI * 2);
      ctx.fill();

    } else {
      // Basic enemy
      if (e.flashTimer > 0) {
        ctx.fillStyle = '#fff';
      } else {
        ctx.fillStyle = '#cc2244';
      }

      ctx.shadowColor = '#ff2244';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  // Player
  ctx.save();

  // Dash trail
  if (player.isDashing && player.dashStart) {
    const alpha = 0.4;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#4488ff';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(player.dashStart.x, player.dashStart.y);
    ctx.lineTo(player.x, player.y);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Player body
  ctx.fillStyle = player.isDashing ? '#aaddff' : '#4488ff';
  ctx.shadowColor = '#4488ff';
  ctx.shadowBlur = player.isDashing ? 25 : 15;
  ctx.beginPath();
  ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
  ctx.fill();

  // Inner
  ctx.fillStyle = '#88bbff';
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.arc(player.x, player.y, PLAYER_RADIUS * 0.5, 0, Math.PI * 2);
  ctx.fill();

  // Cooldown indicator
  if (player.cooldownTimer > 0) {
    const t = player.cooldownTimer / DASH_COOLDOWN;
    ctx.strokeStyle = `rgba(255,255,255,${t * 0.4})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x, player.y, PLAYER_RADIUS + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - t));
    ctx.stroke();
  }

  ctx.restore();

  // Particles
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius * alpha, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // HUD
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = '14px monospace';
  ctx.fillText(`KILLS: ${score}`, 20, 30);

  // Instructions (fade out after a few seconds)
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '13px monospace';
  ctx.fillText('Click to dash & slash', 20, canvas.height - 20);
  ctx.fillText('Red arc on gold enemies = slash direction', 20, canvas.height - 40);

  ctx.restore();
}

// ============================================================
// GAME LOOP
// ============================================================
function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  let dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;

  // Clamp dt to avoid spiral of death
  if (dt > 0.1) dt = 0.1;

  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

init();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
